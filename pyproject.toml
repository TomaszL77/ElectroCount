[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "electrocount"
version = "0.5.0"
description = "Local electrical takeoff desktop application"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "pypdfium2>=5,<6", "numpy>=2,<3", "opencv-python-headless>=4.10,<6"]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]

[project.scripts]
electrocount = "electrocount.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
