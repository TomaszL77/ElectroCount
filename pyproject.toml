[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "electrocount"
version = "0.7.7.1"
description = "Local electrical takeoff desktop application"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.11.2", "pypdfium2==5.13.0", "numpy==2.5.3", "opencv-python==5.0.0.93", "pillow==12.3.0", "onnxruntime==1.22.1", "rapidocr-onnxruntime==1.4.4"]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]

[project.scripts]
electrocount = "electrocount.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/test_template_077.py"]
